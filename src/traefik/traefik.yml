# =============================================================================
# traefik.yml — Configuração estática do Traefik
# Gerado pelo build.sh
# =============================================================================

global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: false

log:
  level: INFO

entryPoints:
  web:
    address: ":80"

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: "{{DOMAIN}}"
            sans:
              - "*.{{DOMAIN}}"

certificatesResolvers:
  letsencrypt:
    acme:
      email: "{{ACME_EMAIL}}"
      storage: /acme/acme.json
      # DNS Challenge — não precisa abrir porta 80 para a internet
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy
